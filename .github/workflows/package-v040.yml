name: Package v0.4.0

on:
  workflow_dispatch:
  push:
    branches: ["install/**"]
    paths:
      - ".github/workflows/package-v040.yml"
      - ".github/workflows/package-v040.yml"
      - "Makefile"
      - "tools/metal/**"
      - "userspace/vulkan/**"
      - "tools/package/**"
      - "src/**"
      - "include/**"
      - "firmware/**"

permissions:
  contents: read

concurrency:
  group: package-v040-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build complete v0.4.0 installer
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew install llvm lld ninja bison flex pkg-config glslang cmake
          echo "LLVM=$(brew --prefix llvm)" >> "$GITHUB_ENV"
          echo "LLD=$(brew --prefix lld)" >> "$GITHUB_ENV"
          echo "PATH=$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH" >> "$GITHUB_ENV"
          sw_vers
          xcodebuild -version
          uname -m

      - name: Verify Metal toolchain
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Fetch AMD firmware
        run: tools/build/fetch-firmware.sh

      - name: Build matching release kext and test tools
        run: make all PVGPU=1

      - name: Build x86_64 Metal shader translator
        run: make metal-helper

      - name: Build Mesa RADV Vulkan driver
        run: make mesa

      - name: Build complete user-space bundle and installer
        run: make package

      - name: Validate package contents and assemble release archive
        shell: bash
        run: |
          set -euo pipefail
          dir="$(make -s product-dir)"
          kext="$dir/AMDRadeonRDNA4.kext"
          bundle="$dir/AMDRadeonRDNA4MTLDriver.bundle"
          pkg="$dir/AMDRadeonRDNA4-0.4.0.pkg"
          test -x "$kext/Contents/MacOS/AMDRadeonRDNA4"
          test -f "$kext/Contents/Info.plist"
          test -x "$bundle/Contents/MacOS/AMDRadeonRDNA4MTLDriver"
          test -x "$bundle/Contents/Helpers/air2amdgpu"
          test -x "$bundle/Contents/Helpers/rdna4-run"
          test -f "$bundle/Contents/Frameworks/libvulkan_radeon.dylib"
          test -f "$bundle/Contents/Resources/radeon_icd.json"
          test -f "$bundle/Contents/Resources/rdna4.metallib"
          test -s "$pkg"
          plutil -lint "$kext/Contents/Info.plist"
          plutil -lint "$bundle/Contents/Info.plist"
          plutil -lint "$bundle/Contents/Frameworks/AMDRadeonRDNA4.framework/Resources/Info.plist"
          xar -tf "$pkg" | grep -q 'Distribution'
          mkdir -p dist/AMDRadeonRDNA4-0.4.0
          ditto "$kext" dist/AMDRadeonRDNA4-0.4.0/AMDRadeonRDNA4.kext
          cp "$pkg" README.md dist/AMDRadeonRDNA4-0.4.0/
          (cd dist && shasum -a 256 AMDRadeonRDNA4-0.4.0/* > AMDRadeonRDNA4-0.4.0/SHA256SUMS.txt)
          ditto -c -k --sequesterRsrc --keepParent dist/AMDRadeonRDNA4-0.4.0 AMDRadeonRDNA4-0.4.0-macos-tahoe.zip
          shasum -a 256 AMDRadeonRDNA4-0.4.0-macos-tahoe.zip

      - name: Upload complete installer and matching kext
        uses: actions/upload-artifact@v4
        with:
          name: AMDRadeonRDNA4-v0.4.0-macos-tahoe
          if-no-files-found: error
          retention-days: 30
          path: |
            AMDRadeonRDNA4-0.4.0-macos-tahoe.zip
            dist/AMDRadeonRDNA4-0.4.0/
