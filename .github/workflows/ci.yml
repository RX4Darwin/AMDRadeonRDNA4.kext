# Builds the kext (plain, PVGPU, DEBUG), the user-space tools and the native Metal bundle, and runs the host tests, on every push and
# pull request. No card here: a green run says it builds and the host checks pass, not that it works on an RX 9070 XT. Nothing is
# published: releases stay manual (CONTRIBUTING.md).
name: CI

on:
  push:
    branches: [main, next, "devel/**", "premetal/**", "dev/**", "tahoe-26.7.3-native-metal-compat"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        run: |
          sw_vers; xcodebuild -version; uname -m
          # Homebrew's llvm (23): what the committed shader headers were made with (check-isa compares them with a fresh assembly;
          # LLVM 19 encodes an unused VOP3 operand differently and cannot decode nggfill's VOP3 literals)
          brew install llvm
          echo "LLVM_MC=$(brew --prefix llvm)/bin/llvm-mc" >> "$GITHUB_ENV"
          # Xcode 26 ships the Metal compiler as a separate component (the bundle's probe.metallib)
          xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Kext, plain
        run: make all PVGPU=0

      - name: Kext, PVGPU (what the release zips are)
        run: make all PVGPU=1

      - name: Kext, PVGPU, DEBUG
        run: make all PVGPU=1 CONFIG=DEBUG

      - name: "Host tests (no ROM dump, no firmware: those checks say they are left out)"
        run: make test

      - name: Repository script syntax
        run: |
          for script in tools/rig/*.sh tools/build/*.sh tools/metal/native/*.sh; do
            bash -n "$script"
          done
          python3 -m py_compile tools/gen/accelgen.py

      - name: Native Metal bundle and mtlprobe
        run: |
          sh tools/metal/native/build.sh
          clang -arch x86_64 -mmacosx-version-min=11.0 -fobjc-arc tools/metal/m1/mtlprobe.m -framework Foundation -framework Metal \
            -framework IOSurface -framework AppKit -framework QuartzCore -framework IOKit -o Build/mtlprobe

  firmware:
    # The checks that need AMD's linux-firmware blobs (fetched from upstream, so upstream can break this job without us)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fetch firmware
        run: tools/build/fetch-firmware.sh
      - name: Host tests with firmware
        run: make test
      - name: Kext with firmware embedded
        run: make all PVGPU=1

  abi:
    # Generate declarations from the exact Tahoe 26.7.3 (25G342) KDK and compare with the v0.4.0 baseline.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache exact Tahoe 26.7.3 KDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Kernel_Debug_Kit_26.7.3_build_25G342.dmg
          key: kdk-25G342-219f27c7e039b6ab3426496e0d5852d55a31d00b3d3984d855cba04377c5dba0

      - name: Download and verify KDK
        env:
          KDK_DMG: ${{ runner.temp }}/Kernel_Debug_Kit_26.7.3_build_25G342.dmg
        run: |
          if [ ! -f "$KDK_DMG" ]; then
            curl --fail --location --retry 5 --retry-all-errors \
              "https://github.com/dortania/KdkSupportPkg/releases/download/25G342/Kernel_Debug_Kit_26.7.3_build_25G342.dmg" \
              --output "$KDK_DMG"
          fi
          echo "219f27c7e039b6ab3426496e0d5852d55a31d00b3d3984d855cba04377c5dba0  $KDK_DMG" | shasum -a 256 --check

      - name: Install exact KDK
        env:
          KDK_DMG: ${{ runner.temp }}/Kernel_Debug_Kit_26.7.3_build_25G342.dmg
        run: |
          MOUNT="$RUNNER_TEMP/kdk-mount"
          mkdir -p "$MOUNT"
          hdiutil attach "$KDK_DMG" -readonly -nobrowse -mountpoint "$MOUNT"
          cleanup() { hdiutil detach "$MOUNT" -quiet || true; }
          trap cleanup EXIT

          PKG="$(find "$MOUNT" -maxdepth 3 -name '*.pkg' -print -quit)"
          if [ -n "$PKG" ]; then
            sudo installer -pkg "$PKG" -target /
          else
            KDK_BUNDLE="$(find "$MOUNT" -maxdepth 3 -name '*.kdk' -print -quit)"
            if [ -z "$KDK_BUNDLE" ]; then
              echo "No installer package or .kdk bundle found in mounted image" >&2
              find "$MOUNT" -maxdepth 3 -print
              exit 1
            fi
            sudo mkdir -p /Library/Developer/KDKs
            sudo ditto "$KDK_BUNDLE" /Library/Developer/KDKs/"$(basename "$KDK_BUNDLE")"
          fi

          KDK_PATH="$(find /Library/Developer/KDKs -maxdepth 1 -type d -name '*25G342*.kdk' -print -quit)"
          if [ -z "$KDK_PATH" ]; then
            echo "Installed KDK for build 25G342 was not found" >&2
            find /Library/Developer/KDKs -maxdepth 2 -print || true
            exit 1
          fi
          echo "KDK_PATH=$KDK_PATH" >> "$GITHUB_ENV"
          echo "Using $KDK_PATH"

      - name: Generate Tahoe ABI declarations
        run: |
          python3 tools/gen/accelgen.py --kdk "$KDK_PATH" --output-dir "$RUNNER_TEMP/rdna4-tahoe-abi"
          test -s "$RUNNER_TEMP/rdna4-tahoe-abi/src/ioaccel.hpp"
          test -s "$RUNNER_TEMP/rdna4-tahoe-abi/src/ioaccel_thunks.S"
          test -s "$RUNNER_TEMP/rdna4-tahoe-abi/src/ioaccel_symbols.inc"
          test -s "$RUNNER_TEMP/rdna4-tahoe-abi/src/ioaccel_slots.inc"
          test -s "$RUNNER_TEMP/rdna4-tahoe-abi/src/ioaccel_kexts.inc"
          test -s "$RUNNER_TEMP/rdna4-tahoe-abi/src/ioaccel_classes.inc"

      - name: Compare generated ABI with committed v0.4.0 declarations
        run: |
          set +e
          for file in ioaccel.hpp ioaccel_thunks.S ioaccel_symbols.inc ioaccel_slots.inc ioaccel_kexts.inc ioaccel_classes.inc; do
            echo "::group::$file"
            diff -u "src/$file" "$RUNNER_TEMP/rdna4-tahoe-abi/src/$file"
            status=$?
            if [ "$status" -gt 1 ]; then exit "$status"; fi
            echo "::endgroup::"
          done

      - name: Upload generated ABI files
        uses: actions/upload-artifact@v4
        with:
          name: tahoe-26.7.3-25G342-generated-abi
          path: ${{ runner.temp }}/rdna4-tahoe-abi/src/
          if-no-files-found: error
          retention-days: 14
