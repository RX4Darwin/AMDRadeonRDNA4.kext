name: Tahoe 26.7.3 ABI audit

on:
  push:
    branches: [tahoe-26.7.3-native-metal-compat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tahoe-abi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abi:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache exact Tahoe 26.7.3 KDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Kernel_Debug_Kit_26.7.3_build_25G342.dmg
          key: kdk-25G342-219f27c7e039b6ab3426496e0d5852d55a31d00b3d3984d855cba04377c5dba0

      - name: Download and verify KDK
        env:
          KDK_DMG: ${{ runner.temp }}/Kernel_Debug_Kit_26.7.3_build_25G342.dmg
        run: |
          if [ ! -f "$KDK_DMG" ]; then
            curl --fail --location --retry 5 --retry-all-errors \
              "https://github.com/dortania/KdkSupportPkg/releases/download/25G342/Kernel_Debug_Kit_26.7.3_build_25G342.dmg" \
              --output "$KDK_DMG"
          fi
          echo "219f27c7e039b6ab3426496e0d5852d55a31d00b3d3984d855cba04377c5dba0  $KDK_DMG" | shasum -a 256 --check

      - name: Install exact KDK
        env:
          KDK_DMG: ${{ runner.temp }}/Kernel_Debug_Kit_26.7.3_build_25G342.dmg
        run: |
          MOUNT="$RUNNER_TEMP/kdk-mount"
          mkdir -p "$MOUNT"
          hdiutil attach "$KDK_DMG" -readonly -nobrowse -mountpoint "$MOUNT"
          cleanup() { hdiutil detach "$MOUNT" -quiet || true; }
          trap cleanup EXIT

          PKG="$(find "$MOUNT" -maxdepth 3 -name '*.pkg' -print -quit)"
          if [ -n "$PKG" ]; then
            sudo installer -pkg "$PKG" -target /
          else
            KDK_BUNDLE="$(find "$MOUNT" -maxdepth 3 -name '*.kdk' -print -quit)"
            if [ -z "$KDK_BUNDLE" ]; then
              echo "No installer package or .kdk bundle found in mounted image" >&2
              find "$MOUNT" -maxdepth 3 -print
              exit 1
            fi
            sudo mkdir -p /Library/Developer/KDKs
            sudo ditto "$KDK_BUNDLE" /Library/Developer/KDKs/"$(basename "$KDK_BUNDLE")"
          fi

          KDK_PATH="$(find /Library/Developer/KDKs -maxdepth 1 -type d -name '*25G342*.kdk' -print -quit)"
          if [ -z "$KDK_PATH" ]; then
            echo "Installed KDK for build 25G342 was not found" >&2
            find /Library/Developer/KDKs -maxdepth 2 -print || true
            exit 1
          fi
          echo "KDK_PATH=$KDK_PATH" >> "$GITHUB_ENV"
          echo "Using $KDK_PATH"

      - name: Generate Tahoe ABI declarations
        run: |
          python3 tools/gen/accelgen.py --kdk "$KDK_PATH" --output-dir "$RUNNER_TEMP/rdna4-tahoe-abi"
          test -s "$RUNNER_TEMP/rdna4-tahoe-abi/src/ioaccel.hpp"
          test -s "$RUNNER_TEMP/rdna4-tahoe-abi/src/ioaccel_thunks.S"
          test -s "$RUNNER_TEMP/rdna4-tahoe-abi/src/ioaccel_symbols.inc"
          test -s "$RUNNER_TEMP/rdna4-tahoe-abi/src/ioaccel_slots.inc"
          test -s "$RUNNER_TEMP/rdna4-tahoe-abi/src/ioaccel_kexts.inc"
          test -s "$RUNNER_TEMP/rdna4-tahoe-abi/src/ioaccel_classes.inc"

      - name: Compare generated ABI with committed v0.4.0 declarations
        run: |
          set +e
          for file in ioaccel.hpp ioaccel_thunks.S ioaccel_symbols.inc ioaccel_slots.inc ioaccel_kexts.inc ioaccel_classes.inc; do
            echo "::group::$file"
            diff -u "src/$file" "$RUNNER_TEMP/rdna4-tahoe-abi/src/$file"
            status=$?
            if [ "$status" -gt 1 ]; then exit "$status"; fi
            echo "::endgroup::"
          done

      - name: Upload generated ABI files
        uses: actions/upload-artifact@v4
        with:
          name: tahoe-26.7.3-25G342-generated-abi
          path: ${{ runner.temp }}/rdna4-tahoe-abi/src/
          if-no-files-found: error
          retention-days: 14
